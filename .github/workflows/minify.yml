name: Build & deploy

# Batch 24 (B24-01/02): replaces the old "minify, commit dist/ back" flow.
#   • Builds dist/ fresh on every push (never committed — no bot commits, no
#     push races, no stale dist/).
#   • Runs a deploy guard: if index.html, sw.js, manifest.json or the app
#     reference a file that doesn't exist, the deploy is cancelled and the
#     live site stays on the last good version.
#   • Deploys straight to GitHub Pages.
# REQUIRES (one time): Settings → Pages → Build and deployment → Source:
# "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits instead of racing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install esbuild
        run: npm install esbuild@0.24.0 --no-save --no-audit --no-fund

      - name: Build site
        run: node .github/scripts/build.mjs

      - name: Deploy guard
        run: node .github/scripts/check-refs.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
